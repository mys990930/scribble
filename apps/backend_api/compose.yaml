services:
  db:
    image: postgres:16
    container_name: scribble-backend-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: scribble
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 234Wersdf!
    ports:
      - "5432:5432"
    volumes:
      - scribble_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d scribble"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scribble-backend-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8888
      DATABASE_URL: postgresql+asyncpg://admin:234Wersdf!@db:5432/scribble
      JWT_SECRET: change-this-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_TTL_MINUTES: 15
      REFRESH_TOKEN_TTL_DAYS: 30
      DEVICE_LIMIT_PER_USER: 5
      SYNC_CURSOR_TTL_DAYS: 30
    ports:
      - "8888:8888"

volumes:
  scribble_postgres_data:
